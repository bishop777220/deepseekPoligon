<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="id" value="#{contactEditBean.id}"/>
            <f:viewAction action="#{contactEditBean.init}"/>
        </f:metadata>
    </ui:define>

    <ui:define name="title">
        #{contactEditBean.id == null ? msg['edit.create.title'] : msg['edit.edit.title']}
    </ui:define>

    <ui:define name="content">
        <div class="page-head">
            <div>
                <p class="page-kicker">#{msg['contacts.eyebrow']}</p>
                <h1>#{contactEditBean.id == null ? msg['edit.create.title'] : msg['edit.edit.title']}</h1>
                <p class="page-subtitle">#{msg['edit.subtitle']}</p>
            </div>
            <p:button outcome="index"
                      value="#{msg['action.back']}"
                      icon="pi pi-arrow-left"
                      styleClass="ui-button-outlined"/>
        </div>

        <h:form id="editForm">
            <p:card styleClass="form-card">
                <f:facet name="title">#{msg['edit.form.title']}</f:facet>

                <div class="form-grid">
                    <div class="field">
                        <p:outputLabel for="firstName" value="#{msg['contact.firstName']}"/>
                        <p:inputText id="firstName"
                                     value="#{contactEditBean.contact.firstName}"
                                     maxlength="80"
                                     style="width:100%"/>
                        <p:message for="firstName"/>
                    </div>
                    <div class="field">
                        <p:outputLabel for="lastName" value="#{msg['contact.lastName']}"/>
                        <p:inputText id="lastName"
                                     value="#{contactEditBean.contact.lastName}"
                                     maxlength="80"
                                     style="width:100%"/>
                        <p:message for="lastName"/>
                    </div>

                    <div class="field field-full">
                        <p:outputLabel for="email" value="#{msg['contact.email']}"/>
                        <p:inputText id="email"
                                     value="#{contactEditBean.contact.email}"
                                     maxlength="160"
                                     style="width:100%"/>
                        <p:message for="email"/>
                    </div>

                    <div class="field">
                        <p:outputLabel for="phone" value="#{msg['contact.phone']}"/>
                        <p:inputText id="phone"
                                     value="#{contactEditBean.contact.phone}"
                                     maxlength="40"
                                     style="width:100%"/>
                        <p:message for="phone"/>
                    </div>
                    <div class="field">
                        <p:outputLabel for="organization" value="#{msg['contact.organization']}"/>
                        <p:inputText id="organization"
                                     value="#{contactEditBean.contact.organization}"
                                     maxlength="120"
                                     style="width:100%"/>
                        <p:message for="organization"/>
                    </div>

                    <div class="field">
                        <p:outputLabel for="category" value="#{msg['contact.category']}"/>
                        <p:selectOneMenu id="category"
                                         value="#{contactEditBean.contact.category}"
                                         style="width:100%">
                            <f:selectItems value="#{contactEditBean.categories}"
                                           var="category"
                                           itemValue="#{category}"
                                           itemLabel="#{msg[category.labelKey]}"/>
                        </p:selectOneMenu>
                        <p:message for="category"/>
                    </div>

                    <div class="field field-full">
                        <p:outputLabel for="notes" value="#{msg['contact.notes']}"/>
                        <p:inputTextarea id="notes"
                                         value="#{contactEditBean.contact.notes}"
                                         rows="5"
                                         style="width:100%"/>
                        <p:message for="notes"/>
                    </div>
                </div>

                <div class="form-actions">
                    <p:commandButton value="#{msg['action.save']}"
                                     icon="pi pi-check"
                                     action="#{contactEditBean.save}"
                                     ajax="false"/>
                    <p:button outcome="index"
                              value="#{msg['action.cancel']}"
                              icon="pi pi-times"
                              styleClass="ui-button-outlined ui-button-secondary"/>
                </div>
            </p:card>
        </h:form>
    </ui:define>
</ui:composition>
