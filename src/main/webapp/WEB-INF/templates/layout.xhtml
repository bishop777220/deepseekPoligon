<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<f:view xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="jakarta.faces.html"
        xmlns:f="jakarta.faces.core"
        xmlns:ui="jakarta.faces.facelets"
        xmlns:p="http://primefaces.org/ui"
        contentType="text/html"
        encoding="UTF-8"
        locale="ru">
    <ui:insert name="metadata"/>
    <html lang="ru">
    <h:head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title><ui:insert name="title">#{msg['app.title']}</ui:insert></title>
        <h:outputStylesheet library="css" name="app.css"/>
    </h:head>
    <h:body>
    <header class="app-header">
        <div class="app-container">
            <p:toolbar styleClass="app-toolbar">
                <f:facet name="left">
                    <h:link outcome="index" styleClass="app-brand">
                        <p:avatar label="К" shape="circle" size="large" styleClass="app-brand-avatar"/>
                        <span class="app-brand-copy">
                            <span class="app-brand-title">#{msg['app.title']}</span>
                            <span class="app-brand-subtitle">#{msg['app.tagline']}</span>
                        </span>
                    </h:link>
                </f:facet>
                <f:facet name="right">
                    <div class="app-nav">
                        <p:button outcome="index"
                                  value="#{msg['nav.contacts']}"
                                  icon="pi pi-users"
                                  styleClass="ui-button-flat"/>
                        <p:button outcome="edit"
                                  value="#{msg['nav.add']}"
                                  icon="pi pi-plus"/>
                    </div>
                </f:facet>
            </p:toolbar>
        </div>
    </header>

    <main class="app-main">
        <div class="app-container">
            <p:growl id="growl" showDetail="true" life="4000"/>
            <ui:insert name="content"/>
        </div>
    </main>

    <footer class="app-footer">
        <div class="app-container app-footer-inner">
            <span class="app-footer-title">#{msg['app.title']}</span>
            <span class="app-footer-meta">#{msg['footer.text']}</span>
        </div>
    </footer>
    </h:body>
    </html>
</f:view>
