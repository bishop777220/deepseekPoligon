<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="title">#{msg['error.title']}</ui:define>

    <ui:define name="content">
        <p:card styleClass="error-card">
            <div class="error-content">
                <i class="pi pi-exclamation-circle error-icon" aria-hidden="true"></i>
                <h1>#{msg['error.title']}</h1>
                <p class="page-subtitle">#{msg['error.text']}</p>
                <p:button outcome="index"
                          value="#{msg['error.back']}"
                          icon="pi pi-arrow-left"/>
            </div>
        </p:card>
    </ui:define>
</ui:composition>
