services:
  mysql:
    image: mysql:8.4
    container_name: contactbook-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: contactbook
      MYSQL_USER: contactbook
      MYSQL_PASSWORD: contactbook
    ports:
      - "3306:3306"
    volumes:
      - contactbook-mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  contactbook-mysql-data:
